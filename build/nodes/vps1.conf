# Узел vps1 — основной VPS: signal + TURN (coturn) + SFU + debug.
# Настроен вручную (build/setup-server.sh под sudo); build/setup-node.sh
# для него не запускается.
#
# SSH-доступ (NODE_SSH, NODE_SSH_PORT) — build/remote/vps1/ssh.conf, не в git.
NODE_DIR='~/vox'
NODE_IP=n1.northwindcdn.com
NODE_WS_PORT=9741

# Ed25519 pubkey сигналки (node_id в кластере). Совпадает с VPSSignalPubkey
# в app/internal/network/known_servers.go.
NODE_PUBKEY=f25ccacf740dce9dd26fdaaced93e5073a7bd549b6a824c5a0e25c7678392bda

# 1 = pubkey зашит в клиент: deploy-signal.sh обновляет known_servers.go.
NODE_PINNED=1

NODE_SETUP=manual
