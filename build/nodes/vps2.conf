# Узел vps2 — второй узел кластера (Selectel). На сервере живут и чужие
# сервисы: nginx 80/443, wg-easy (WireGuard 51820/udp, панель 51821/tcp),
# redis 6379, RU split-routing. Правила ufw Vox только добавляются.
#
# Сервисы Vox работают от пользователя vox в /home/vox/vox.
# Первичная настройка: ./build/setup-node.sh vps2 (под root).
#
# SSH-доступ и IP (NODE_SSH, NODE_SSH_PORT, NODE_ROOT_SSH, NODE_IP) — build/remote/vps2/ssh.conf, не в git.
NODE_DIR=/home/vox/vox
# Имя узла для клиентов и кластера (DNS A-запись, без прокси Cloudflare).
NODE_HOST=n2.northwindcdn.com
NODE_WS_PORT=9741

# Ed25519 pubkey сигналки (node_id в кластере). В клиент не зашит (этап Э2).
NODE_PUBKEY=527534742f96d8b8f76930edc155956533f66c71558f8e40498fd34992703265
NODE_PINNED=0

NODE_SETUP=auto

# Relay-порты coturn: в стороне от WireGuard 51820/51821.
NODE_TURN_MIN_PORT=52000
NODE_TURN_MAX_PORT=59999
